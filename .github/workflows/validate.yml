name: validate
on:
  pull_request:
  push: { branches: [main] }
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/spring-app --set image=placeholder
      - name: Render every app
        run: |
          for f in apps/*/values.yaml; do
            app=$(basename "$(dirname "$f")")
            echo "== $app"
            helm template "$app" charts/spring-app -f "$f" > /dev/null
          done
